<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nagpur DUCT — live preview</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0e1520;--surface:#16202e;--surface-2:#1c2838;--line:#263346;
  --ink:#e6edf5;--ink-muted:#8a9bb0;--accent:#3dd6c4;--accent-dim:#245b56;--pending:#5a6678;
  --shadow:0 8px 30px rgba(0,0,0,.45);--radius:10px;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);overflow:hidden}
#map{position:absolute;inset:0}
.panel{position:absolute;top:16px;left:56px;z-index:5;width:300px;max-width:calc(100vw - 72px);
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.panel-head h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.panel-head p{margin:4px 0 0;font-size:12px;color:var(--ink-muted)}
.panel-section{padding:14px 18px}.panel-section+.panel-section{border-top:1px solid var(--line)}
.section-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 10px}
.layer{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 10px;padding:7px 0}
.layer+.layer{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.layer-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px}
.layer.is-pending .layer-toggle{cursor:not-allowed;color:var(--pending)}
.layer-toggle input{accent-color:var(--accent);width:15px;height:15px;cursor:inherit}
.layer-status{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--pending);text-transform:uppercase;text-align:right}
.layer-opacity{grid-column:1/-1;width:100%;height:3px;margin:2px 0 0;accent-color:var(--accent-dim)}
.layer-opacity:disabled{opacity:.35}
#status-chip{position:absolute;top:16px;right:16px;z-index:5;display:flex;flex-direction:column;gap:2px;
  padding:9px 13px;border-radius:8px;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(10px);border:1px solid var(--line);font-family:var(--mono);text-align:right}
#status-chip b{font-size:11px;font-weight:600;letter-spacing:.04em}
#status-chip .warn{font-size:9.5px;color:#ffcf6b;letter-spacing:.05em}
#status-chip span{font-size:10px;color:var(--ink-muted)}
#legend{position:absolute;left:16px;bottom:118px;z-index:5;width:210px;padding:12px 14px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:8px}
#legend.is-empty{display:none}
.legend-block+.legend-block{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.legend-title{font-size:12px;font-weight:600;margin-bottom:8px}
.legend-bar{width:100%;height:12px;border-radius:3px;display:block;
  background:linear-gradient(90deg,#30123b,#28bceb,#a4fc3c,#fb8022,#7a0403)}
.legend-scale{display:flex;justify-content:space-between;margin-top:4px;font-family:var(--mono);font-size:10px;color:var(--ink-muted)}
.legend-row{display:flex;align-items:center;gap:8px;font-size:11px;padding:2px 0}
.legend-row i{width:12px;height:12px;border-radius:2px;flex:0 0 auto;border:1px solid rgba(0,0,0,.25)}
.legend-note{font-family:var(--mono);font-size:9px;color:#ffcf6b;margin-top:8px;letter-spacing:.04em}
#timeline{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;
  width:min(620px,calc(100vw - 48px));padding:12px 16px 14px;
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.timeline-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:12px}
#timeline-stamp{font-family:var(--mono);font-size:15px;font-weight:500;letter-spacing:.02em}
#timeline-counter{font-family:var(--mono);font-size:11px;color:var(--ink-muted)}
.timeline-body{display:flex;align-items:center;gap:12px}
#timeline-play{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:border-color .15s,background .15s}
#timeline-play:hover{border-color:var(--accent)}
#timeline-play svg{width:14px;height:14px}
#timeline-play .icon-pause{display:none}
#timeline-play.is-playing .icon-play{display:none}
#timeline-play.is-playing .icon-pause{display:block}
#timeline-play.is-playing{border-color:var(--accent);background:var(--accent-dim)}
.track-wrap{position:relative;flex:1 1 auto;height:34px}
#timeline-track{position:absolute;inset:0;width:100%;height:100%;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
#timeline-playhead{position:absolute;top:-3px;bottom:-3px;width:2px;left:0;background:var(--accent);box-shadow:0 0 8px var(--accent);pointer-events:none;transform:translateX(-1px)}
#timeline-range{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.maplibregl-popup-content{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px;box-shadow:var(--shadow);font-family:var(--sans)}
.maplibregl-popup-tip{border-top-color:var(--surface)!important;border-bottom-color:var(--surface)!important}
.popup-title{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.popup-row{display:flex;justify-content:space-between;gap:16px;font-size:12px;padding:3px 0}
.popup-row span{color:var(--ink-muted)}.popup-row b{font-family:var(--mono);font-weight:500}
#station-panel{position:absolute;right:16px;bottom:22px;z-index:5;width:340px;max-width:calc(100vw - 32px);
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  transform:translateY(calc(100% + 40px));transition:transform .35s ease}
#station-panel.is-open{transform:none}
.station-head{display:flex;align-items:baseline;justify-content:space-between;padding:12px 14px 8px}
#station-name{font-size:14px;font-weight:600}#station-meta{font-family:var(--mono);font-size:10px;color:var(--ink-muted)}
#station-close{background:none;border:none;color:var(--ink-muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
#station-close:hover{color:var(--ink)}
.station-chart-wrap{height:160px;padding:0 14px 6px}
.station-note{font-family:var(--mono);font-size:9px;color:#ffcf6b;padding:0 14px 12px;letter-spacing:.04em}
.maplibregl-ctrl-group{background:var(--surface)!important;border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl button .maplibregl-ctrl-icon{filter:invert(1) brightness(.9)}
.maplibregl-ctrl-attrib{background:rgba(14,21,32,.8)!important}
.maplibregl-ctrl-attrib a{color:var(--ink-muted)!important}
.maplibregl-ctrl-scale{background:rgba(14,21,32,.7)!important;color:var(--ink)!important;border-color:var(--line)!important}
@media(max-width:720px){.panel{left:12px;right:12px;top:12px;width:auto}#status-chip{display:none}#legend{bottom:150px}#station-panel{left:12px;right:12px;width:auto}#timeline{bottom:12px}}
</style>
</head>
<body>
<div id="map"></div>
<aside class="panel">
  <div class="panel-head">
    <p class="eyebrow">iFOREST · IHCAP</p>
    <h1>Nagpur Urban Digital Twin</h1>
    <p>Microclimate-informed building &amp; heat exploration</p>
  </div>
  <div class="panel-section">
    <p class="section-label">Layers</p>
    <div id="layer-list"></div>
  </div>
</aside>
<div id="status-chip"></div>
<div id="legend"></div>
<div id="timeline">
  <div class="timeline-top"><span id="timeline-stamp">—</span><span id="timeline-counter"></span></div>
  <div class="timeline-body">
    <button id="timeline-play" aria-label="Play">
      <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="track-wrap"><canvas id="timeline-track"></canvas><div id="timeline-playhead"></div>
      <input id="timeline-range" type="range" min="0" max="47" value="0" step="1" /></div>
  </div>
</div>
<div id="station-panel">
  <div class="station-head"><div><div id="station-name">Station</div><div id="station-meta"></div></div>
    <button id="station-close" aria-label="Close">×</button></div>
  <div class="station-chart-wrap"><canvas id="station-chart"></canvas></div>
  <div class="station-note">synthetic obs/model — placeholder, not project data</div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.js"></script>
<script>
/* ============================================================================
   LIVE PREVIEW — real Nagpur basemap + the real UI, driven by SYNTHETIC data
   so you can feel the interaction. Nothing here is model output.
   The production repo swaps these placeholders for the v4 WRF run.
   ========================================================================== */
const CENTER=[79.0882,21.1458], NF=48;
const BOUNDS=[78.99,21.03,79.19,21.24];           // [w,s,e,n] demo domain
const STOPS=[[0,'#30123b'],[.25,'#28bceb'],[.5,'#a4fc3c'],[.75,'#fb8022'],[1,'#7a0403']];
const LCZ={3:'#c30000',6:'#f5f57a',9:'#fdf5ae',10:'#555555'};
const LCZLABEL={3:'LCZ 3 · Compact low-rise',6:'LCZ 6 · Open low-rise',9:'LCZ 9 · Sparsely built',10:'LCZ 10 · Heavy industry'};

/* ---- tiny colour ramp ---- */
function ramp(t){t=Math.max(0,Math.min(1,t));let a=STOPS[0],b=STOPS[STOPS.length-1];
  for(let i=0;i<STOPS.length-1;i++){if(t>=STOPS[i][0]&&t<=STOPS[i+1][0]){a=STOPS[i];b=STOPS[i+1];break;}}
  const f=(t-a[0])/((b[0]-a[0])||1);const c1=hex(a[1]),c2=hex(b[1]);
  return `rgba(${Math.round(c1[0]+(c2[0]-c1[0])*f)},${Math.round(c1[1]+(c2[1]-c1[1])*f)},${Math.round(c1[2]+(c2[2]-c1[2])*f)},1)`;}
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

/* ---- synthetic T2 field: diurnal swing + urban hotspot (stronger at night) ---- */
function tempAt(u,v,hr){
  const diurnal=Math.sin((hr-9)/24*2*Math.PI);           // warm ~15:00, cool ~03:00
  const base=30+7*diurnal;
  const dx=u-0.52, dy=v-0.48, r2=dx*dx+dy*dy;
  const uhiStrength=2.5+2.0*(-diurnal*0.5+0.5);           // UHI larger at night
  const hot=uhiStrength*Math.exp(-r2/0.05);
  const ripple=0.6*Math.sin(u*9+hr*0.3)*Math.cos(v*7);
  return base+hot+ripple;
}
const VMIN=24,VMAX=44;
function makeFrame(hr){
  const S=200,cv=document.createElement('canvas');cv.width=S;cv.height=S;const ctx=cv.getContext('2d');
  const img=ctx.createImageData(S,S),d=img.data;
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const T=tempAt(x/S,1-y/S,hr),t=(T-VMIN)/(VMAX-VMIN);
    const rgb=ramp(t).match(/\d+/g).map(Number);const i=(y*S+x)*4;
    d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2];d[i+3]=205;
  }
  ctx.putImageData(img,0,0);
  // watermark so this can never be mistaken for model output
  ctx.save();ctx.translate(S/2,S/2);ctx.rotate(-Math.PI/6);
  ctx.font='bold 15px monospace';ctx.fillStyle='rgba(255,255,255,0.28)';ctx.textAlign='center';
  for(let k=-2;k<=2;k++)ctx.fillText('SYNTHETIC PREVIEW',0,k*46);
  ctx.restore();
  return cv.toDataURL('image/png');
}
const FRAMES=Array.from({length:NF},(_,i)=>makeFrame(i%24));

/* ---- synthetic LCZ overlay (blocky schematic) ---- */
function makeLCZ(){
  const S=64,cv=document.createElement('canvas');cv.width=S;cv.height=S;const ctx=cv.getContext('2d');
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const u=x/S,v=1-y/S,dx=u-0.52,dy=v-0.48,r=Math.hypot(dx,dy);
    let cls=9; if(r<0.12)cls=3; else if(r<0.28)cls=6; else if(u>0.78&&v<0.3)cls=10;
    ctx.fillStyle=LCZ[cls];ctx.fillRect(x,y,1,1);
  }
  return cv.toDataURL('image/png');
}

/* ---- schematic buildings: jittered grid of boxes, height ~ distance to core ---- */
function makeBuildings(){
  const feats=[],[w,s,e,n]=BOUNDS,N=26;
  for(let a=0;a<N;a++)for(let b=0;b<N;b++){
    const u=a/N,v=b/N;const dx=u-0.52,dy=v-0.48,r=Math.hypot(dx,dy);
    if(Math.random()<0.18||r>0.42)continue;
    const lon=w+(e-w)*(u+(Math.random()-.5)*0.02);
    const lat=s+(n-s)*(v+(Math.random()-.5)*0.02);
    const sz=0.0016+Math.random()*0.0011;
    const h=Math.max(5,Math.round((0.45-r)*70+Math.random()*14));
    feats.push({type:'Feature',properties:{building_id:`SCH-${a}-${b}`,height:h},
      geometry:{type:'Polygon',coordinates:[[[lon,lat],[lon+sz,lat],[lon+sz,lat+sz*1.3],[lon,lat+sz*1.3],[lon,lat]]]}});
  }
  return {type:'FeatureCollection',features:feats};
}

/* ---- boundary (approx) ---- */
const BOUNDARY={type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:{type:'Polygon',
  coordinates:[[[79.020,21.200],[79.100,21.212],[79.150,21.170],[79.160,21.100],[79.130,21.040],[79.060,21.028],[78.998,21.070],[78.990,21.140],[79.020,21.200]]]}}]};

/* ---- stations ---- */
const STATIONS=[
  {id:'mahal',name:'Mahal',lcz:3,lon:79.107,lat:21.148,u:.62,v:.55},
  {id:'ramnagar',name:'Ram Nagar',lcz:6,lon:79.065,lat:21.135,u:.42,v:.47},
  {id:'ambazari',name:'Ambazari',lcz:9,lon:79.045,lat:21.132,u:.30,v:.45}
];
function stationSeries(st){
  const model=[],obs=[];
  for(let i=0;i<NF;i++){const hr=i%24;const m=tempAt(st.u,st.v,hr);
    model.push(+(m).toFixed(1));obs.push(+(m+ (Math.sin(i*0.7)*0.8) + (Math.random()-.5)*0.6 + 1.2).toFixed(1));}
  return {model,obs};
}

/* ======================= map ======================= */
const OPACITY={wrf:0.78,lcz:0.7};
let VIS={buildings:false,lcz:false,wrf_t2:false};
const map=new maplibregl.Map({
  container:'map',style:'https://tiles.openfreemap.org/styles/positron',
  center:CENTER,zoom:11,minZoom:8,maxZoom:18,pitch:45,bearing:-17,attributionControl:false
});
map.on('error',(e)=>{ // fall back to Carto if OpenFreeMap is unreachable
  if(e&&e.error&&/style|fetch|load/i.test(String(e.error.message||''))&&!map._swapped){
    map._swapped=true;map.setStyle('https://basemaps.cartocdn.com/gl/positron-gl-style/style.json');}
});
map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-left');
map.addControl(new maplibregl.ScaleControl({maxWidth:120,unit:'metric'}),'bottom-left');

const LAYERS=[
  {id:'buildings',name:'Buildings (3D)',kind:'vector',note:'schematic'},
  {id:'lcz',name:'Local Climate Zones',kind:'raster',note:'schematic'},
  {id:'wrf_t2',name:'Air temp (2 m)',kind:'timeseries',note:'synthetic'},
  {id:'palm4u',name:'PALM-4U · microclimate',kind:'pending',note:'awaiting output'},
  {id:'cea',name:'CEA · building energy',kind:'pending',note:'awaiting output'}
];

function addData(){
  const [w,s,e,n]=BOUNDS;
  // boundary
  map.addSource('boundary',{type:'geojson',data:BOUNDARY});
  map.addLayer({id:'boundary-line',type:'line',source:'boundary',
    paint:{'line-color':'#3dd6c4','line-width':1.5,'line-opacity':.7,'line-dasharray':[3,2]}});
  // LCZ
  map.addSource('lcz',{type:'image',url:makeLCZ(),coordinates:[[w,n],[e,n],[e,s],[w,s]]});
  map.addLayer({id:'lcz-raster',type:'raster',source:'lcz',layout:{visibility:'none'},
    paint:{'raster-opacity':OPACITY.lcz,'raster-resampling':'nearest'}});
  // WRF synthetic frames
  map.addSource('wrf',{type:'image',url:FRAMES[0],coordinates:[[w,n],[e,n],[e,s],[w,s]]});
  map.addLayer({id:'wrf-raster',type:'raster',source:'wrf',layout:{visibility:'none'},
    paint:{'raster-opacity':OPACITY.wrf,'raster-fade-duration':0}});
  // buildings
  map.addSource('bld',{type:'geojson',data:makeBuildings()});
  map.addLayer({id:'buildings-3d',type:'fill-extrusion',source:'bld',layout:{visibility:'none'},
    paint:{'fill-extrusion-color':['interpolate',['linear'],['get','height'],5,'#c9d3e0',15,'#93a3bd',30,'#5f7391',55,'#3d4f6b'],
      'fill-extrusion-height':['get','height'],'fill-extrusion-opacity':.88}});
  map.on('click','buildings-3d',(ev)=>{const p=ev.features[0].properties;
    new maplibregl.Popup({maxWidth:'260px'}).setLngLat(ev.lngLat).setHTML(
      `<div class="popup-title">Building · schematic</div>
       <div class="popup-row"><span>ID</span><b>${p.building_id}</b></div>
       <div class="popup-row"><span>Height</span><b>${(+p.height).toFixed(1)} m</b></div>
       <div class="popup-row"><span>Cooling demand</span><b>pending (CEA)</b></div>`).addTo(map);});
  map.on('mouseenter','buildings-3d',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','buildings-3d',()=>map.getCanvas().style.cursor='');
  // stations
  map.addSource('stations',{type:'geojson',data:{type:'FeatureCollection',features:STATIONS.map(s=>({
    type:'Feature',geometry:{type:'Point',coordinates:[s.lon,s.lat]},properties:{id:s.id,name:s.name}}))}});
  map.addLayer({id:'stations-pt',type:'circle',source:'stations',
    paint:{'circle-radius':6,'circle-color':'#3dd6c4','circle-stroke-color':'#0e1520','circle-stroke-width':2}});
  map.addLayer({id:'stations-label',type:'symbol',source:'stations',
    layout:{'text-field':['get','name'],'text-size':11,'text-offset':[0,1.2],'text-anchor':'top'},
    paint:{'text-color':'#0e1520','text-halo-color':'#fff','text-halo-width':1.5}});
  map.on('click','stations-pt',(ev)=>selectStation(ev.features[0].properties.id));
  map.on('mouseenter','stations-pt',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','stations-pt',()=>map.getCanvas().style.cursor='');
}

/* ---- panel ---- */
function buildPanel(){
  const list=document.getElementById('layer-list');
  LAYERS.forEach(L=>{
    const ready=L.kind!=='pending';
    const row=document.createElement('div');row.className='layer'+(ready?'':' is-pending');
    const lab=document.createElement('label');lab.className='layer-toggle';
    const cb=document.createElement('input');cb.type='checkbox';cb.disabled=!ready;
    const nm=document.createElement('span');nm.textContent=L.name;lab.append(cb,nm);
    const st=document.createElement('span');st.className='layer-status';st.textContent=L.note;
    row.append(lab,st);
    let op=null;
    if(ready&&(L.kind==='raster'||L.kind==='timeseries')){
      op=document.createElement('input');op.type='range';op.min=0;op.max=1;op.step=.05;op.value=(L.id==='lcz'?OPACITY.lcz:OPACITY.wrf);
      op.className='layer-opacity';op.disabled=true;
      op.addEventListener('input',()=>{const gl=L.id==='lcz'?'lcz-raster':'wrf-raster';map.setPaintProperty(gl,'raster-opacity',+op.value);});
      row.append(op);
    }
    cb.addEventListener('change',()=>{const on=cb.checked;VIS[L.id]=on;
      const gl={buildings:'buildings-3d',lcz:'lcz-raster',wrf_t2:'wrf-raster'}[L.id];
      if(gl)map.setLayoutProperty(gl,'visibility',on?'visible':'none');
      if(op)op.disabled=!on;
      if(L.id==='wrf_t2')document.getElementById('timeline').style.opacity=on?1:.6;
      syncLegend();});
    list.append(row);
  });
}

/* ---- legend ---- */
function syncLegend(){
  const box=document.getElementById('legend');box.innerHTML='';
  if(VIS.wrf_t2){const b=document.createElement('div');b.className='legend-block';
    b.innerHTML=`<div class="legend-title">Air temperature (2 m)</div><div class="legend-bar"></div>
      <div class="legend-scale"><span>${VMIN}</span><span>${(VMIN+VMAX)/2}</span><span>${VMAX} °C</span></div>
      <div class="legend-note">synthetic — not model output</div>`;box.append(b);}
  if(VIS.lcz){const b=document.createElement('div');b.className='legend-block';
    b.innerHTML='<div class="legend-title">Local Climate Zones</div>'+Object.keys(LCZ).map(k=>
      `<div class="legend-row"><i style="background:${LCZ[k]}"></i><span>${LCZLABEL[k]}</span></div>`).join('');box.append(b);}
  box.classList.toggle('is-empty',!(VIS.wrf_t2||VIS.lcz));
}

/* ---- timeline ---- */
const T={i:0,playing:false,timer:null};
const t0=new Date('2025-04-15T00:00:00');
function fmt(i){const d=new Date(t0.getTime()+i*3600*1000);
  return d.toLocaleString('en-GB',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'UTC'}).replace(',','')+' IST';}
function goto(i){i=((i%NF)+NF)%NF;T.i=i;
  map.getSource('wrf')&&map.getSource('wrf').updateImage({url:FRAMES[i]});
  document.getElementById('timeline-range').value=i;
  document.getElementById('timeline-stamp').textContent=fmt(i);
  document.getElementById('timeline-counter').textContent='hour '+String(i+1).padStart(2,'0')+' / '+NF;
  document.getElementById('timeline-playhead').style.left=(i/(NF-1)*100)+'%';}
function play(){T.playing=true;document.getElementById('timeline-play').classList.add('is-playing');
  const step=()=>{goto(T.i+1);T.timer=setTimeout(step,250);};T.timer=setTimeout(step,250);}
function stop(){T.playing=false;document.getElementById('timeline-play').classList.remove('is-playing');clearTimeout(T.timer);}
function drawTrack(){
  const cv=document.getElementById('timeline-track'),dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  for(let i=0;i<NF;i++){const hr=i%24,night=hr<6||hr>=19,x=i/(NF-1)*w,bw=w/(NF-1)+1;
    ctx.fillStyle=night?'rgba(30,42,60,.85)':'rgba(61,214,196,.10)';ctx.fillRect(x-bw/2,0,bw,h);
    if(hr===0){ctx.fillStyle='rgba(230,237,245,.35)';ctx.fillRect(x-.5,0,1,h);}}
}

/* ---- stations chart ---- */
let chart=null;
function selectStation(id){const s=STATIONS.find(x=>x.id===id);if(!s)return;
  document.getElementById('station-panel').classList.add('is-open');
  document.getElementById('station-name').textContent=s.name;
  document.getElementById('station-meta').textContent=`${s.lat.toFixed(3)}, ${s.lon.toFixed(3)} · LCZ ${s.lcz}`;
  const {model,obs}=stationSeries(s);
  const ctx=document.getElementById('station-chart').getContext('2d');
  if(chart)chart.destroy();
  chart=new Chart(ctx,{type:'line',data:{labels:model.map((_,i)=>i),datasets:[
    {label:'Observed',data:obs,borderColor:'#e6edf5',borderWidth:1.5,pointRadius:0,tension:.3},
    {label:'Model',data:model,borderColor:'#3dd6c4',borderWidth:1.5,pointRadius:0,tension:.3}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      scales:{x:{title:{display:true,text:'hour',color:'#8a9bb0'},ticks:{color:'#8a9bb0',maxTicksLimit:8},grid:{color:'rgba(255,255,255,.05)'}},
        y:{title:{display:true,text:'°C',color:'#8a9bb0'},ticks:{color:'#8a9bb0'},grid:{color:'rgba(255,255,255,.05)'}}},
      plugins:{legend:{labels:{color:'#e6edf5',boxWidth:12,font:{size:11}}}}}});}

/* ---- boot ---- */
document.getElementById('status-chip').innerHTML=
  '<b>WRF v4 · d03 · 96 h</b><span>Apr 2025 · demo domain</span><span class="warn">PREVIEW · synthetic data</span>';
document.getElementById('timeline-play').addEventListener('click',()=>T.playing?stop():play());
document.getElementById('timeline-range').addEventListener('input',e=>{stop();goto(+e.target.value);});
document.getElementById('station-close').addEventListener('click',()=>document.getElementById('station-panel').classList.remove('is-open'));
window.addEventListener('resize',drawTrack);

map.on('load',()=>{addData();buildPanel();drawTrack();goto(0);syncLegend();
  // turn WRF on by default so the signature is visible immediately
  document.querySelectorAll('#layer-list .layer').forEach(row=>{
    const lab=row.querySelector('span').textContent;
    if(lab==='Air temp (2 m)'){const cb=row.querySelector('input');cb.checked=true;cb.dispatchEvent(new Event('change'));}
  });
});
</script>
